bundle:
  name: deepwiki-research
  version: 1.5.0
  description: DeepWiki MCP integration for understanding open-source projects

# NOTE: The DeepWiki MCP server is intentionally NOT exposed to the root session.
# The raw mcp_deepwiki_* tools belong only to the deepwiki-expert sub-session (configured
# in agents/deepwiki-expert.md). Root sessions delegate to that agent rather than calling
# MCP directly — keeping this behavior a thin pointer with zero root-level MCP surface.

# Pattern-detection hook: injects deepwiki reminders when GitHub URLs
# or library questions appear in conversation
hooks:
  - module: hooks-deepwiki-trigger
    source: ../modules/hooks-deepwiki-trigger
    config:
      enabled: true
      cooldown_turns: 3
      scan_depth: 3
      max_injections: 15

# Context-sink agent for heavy documentation work
agents:
  include:
    - deepwiki:deepwiki-expert

# Thin awareness injected into root sessions
context:
  include:
    - deepwiki:context/deepwiki-awareness.md
